<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Notas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --navy:#1B2A41; --navy-2:#25405e; --paper:#F7F5EF; --paper-2:#ECE7DA;
  --ink:#20232b; --amber:#D9A441; --green:#2f6b4a; --red:#B4443D; --line:#D8D2C2;
}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--paper);color:var(--ink);}
.app{display:flex;min-height:100vh}
nav{background:var(--navy);color:#fff;width:200px;flex:0 0 200px;padding:24px 0;position:sticky;top:0;height:100vh}
nav h1{font-size:1.0rem;padding:0 20px 18px;margin:0 0 10px;border-bottom:1px solid rgba(255,255,255,.15);line-height:1.3}
nav button{display:block;width:100%;text-align:left;background:none;border:none;color:#cdd6e0;padding:12px 20px;font-family:Georgia,serif;font-size:.95rem;cursor:pointer;border-left:3px solid transparent}
nav button.active{color:#fff;background:var(--navy-2);border-left-color:var(--amber)}
nav button:hover{color:#fff}
nav .signout{margin-top:auto;opacity:.7;font-size:.8rem}
main{flex:1;min-width:0;padding:32px 40px;max-width:1080px}
h2{font-size:1.5rem;margin:0 0 4px;font-weight:600}
h3{font-size:1.1rem;margin:18px 0 6px;color:var(--navy)}
.sub{color:#6b7280;font-family:'Segoe UI',Arial,sans-serif;font-size:.88rem;margin-bottom:22px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
label{font-family:'Segoe UI',Arial,sans-serif;font-size:.78rem;color:#555;display:block;margin-bottom:4px}
select,input{font-family:'Segoe UI',Arial,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:.9rem}
button.btn{font-family:'Segoe UI',Arial,sans-serif;background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:4px;cursor:pointer;font-size:.88rem}
button.btn:hover{background:var(--navy-2)}
button.btn.ghost{background:none;color:var(--navy);border:1px solid var(--navy)}
button.btn.danger{background:none;color:var(--red);border:1px solid var(--red);padding:5px 10px;font-size:.78rem}
table{width:100%;border-collapse:collapse;background:#fff;font-family:'Segoe UI',Arial,sans-serif;font-size:.85rem}
th,td{padding:8px 9px;border-bottom:1px solid var(--paper-2);text-align:left}
th{background:var(--paper-2);font-weight:600;font-size:.74rem;color:#444}
tr:hover td{background:#fbfaf6}
.nota-in{width:56px;text-align:center}
.nota-in:focus{outline:2px solid var(--amber);outline-offset:-1px;background:#fffbee}
.overlay{position:fixed;inset:0;background:rgba(27,42,65,.65);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'Segoe UI',Arial,sans-serif}
.overlay .box{background:#fff;border-radius:8px;padding:28px 36px;text-align:center;min-width:280px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.spinner{width:42px;height:42px;border:4px solid var(--paper-2);border-top-color:var(--navy);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:8px;background:var(--paper-2);border-radius:4px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
button.btn:disabled{opacity:.5;cursor:not-allowed}
.aprob{color:var(--green);font-weight:600}
.desaprob{color:var(--red);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:16px}
.stat{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 20px;min-width:140px;font-family:'Segoe UI',Arial,sans-serif}
.stat b{display:block;font-size:1.6rem;font-family:Georgia,serif;color:var(--navy)}
.stat span{font-size:.75rem;color:#777}
.bar-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-family:'Segoe UI',Arial,sans-serif;font-size:.82rem}
.bar-label{width:190px;flex:0 0 190px}
.bar-track{flex:1;background:var(--paper-2);border-radius:3px;height:16px;overflow:hidden}
.bar-fill{height:100%;background:var(--amber)}
.empty{color:#888;font-family:'Segoe UI',Arial,sans-serif;font-style:italic;padding:30px 0;text-align:center}
.tabbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabbar button{font-family:'Segoe UI',Arial,sans-serif;background:none;border:1px solid var(--line);padding:7px 14px;border-radius:14px;cursor:pointer;font-size:.82rem;color:#555}
.tabbar button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.rpt-head{text-align:center;margin-bottom:14px}
.rpt-head h3{margin:0 0 2px;font-size:1.3rem}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy)}
.login-card{background:#fff;border-radius:8px;padding:36px 40px;width:320px;font-family:'Segoe UI',Arial,sans-serif}
.login-card h2{font-family:Georgia,serif;color:var(--navy);margin-top:0}
.login-card input{width:100%;margin-bottom:12px}
.login-err{color:var(--red);font-size:.82rem;margin-top:8px;min-height:1em}
.stk th:first-child,.stk td:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line)}.stk th:first-child{background:var(--paper-2)}
.c{position:relative;display:inline-block;vertical-align:top}
.c input.nota-in{padding:6px 15px 6px 4px;touch-action:manipulation}
.c .lki{position:absolute;right:4px;top:11px;width:11px;height:11px;display:none;color:#8a8a8a;pointer-events:none}
.c.lk .lki{display:block}
.c.lk input{background:var(--paper-2);color:#666;cursor:pointer}
.c.md input{background:#fff4d6;border-color:#D9A441;color:#8a6212;font-weight:700}
.c .pv{font-size:.68rem;color:#8a6212;height:14px;line-height:14px;white-space:nowrap}
.chgbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
#chgCnt{padding:5px 12px;border-radius:6px;background:#eee;font:.85rem 'Segoe UI',Arial,sans-serif;color:#555}
#chgCnt.on{background:#fff4d6;color:#8a6212;font-weight:600}
.bar-track{position:relative}
.bar-track .thr{position:absolute;left:65%;top:0;bottom:0;border-left:2px dashed #555;opacity:.6}
.bar-row[data-gc]:hover,.bar-row[data-gg]:hover{background:#fbf3df}
.heat{table-layout:fixed}.heat th{font-size:.7rem;text-align:center}.heat td{color:#fff;text-align:center;cursor:pointer;font-weight:600;border:2px solid #fff}.heat td:hover{filter:brightness(1.12)}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.74rem;font-weight:600;background:#eee;color:#555}
.pill.bad{background:#f6dcda;color:#B4443D}.pill.mid{background:#fbecc9;color:#8a6212}.pill.ok{background:#d7ebde;color:#2f6b4a}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.lg{font-family:'Segoe UI',Arial,sans-serif;font-size:.78rem;border:1px solid var(--line);background:#fff;border-radius:12px;padding:3px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}.lg.off{opacity:.4;text-decoration:line-through}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
circle[data-tip]{cursor:pointer}
@page{size:A4 landscape;margin:0}
@media print{ nav,.no-print{display:none!important} main{padding:12mm;max-width:none} .app{display:block} }
@media (max-width:760px){
  .app{flex-direction:column}
  nav{width:100%;height:auto;flex:0 0 auto;position:sticky;top:0;z-index:50;display:flex;overflow-x:auto;padding:0;-webkit-overflow-scrolling:touch}
  nav h1{display:none} nav button{white-space:nowrap;border-left:none;border-bottom:3px solid transparent}
  nav button.active{border-bottom-color:var(--amber)}
  nav button{width:auto;flex:0 0 auto;padding:14px 16px;font-size:.9rem}
  nav .signout{margin-top:0!important;padding:14px 16px!important}
  main{padding:14px 12px 84px}
  h2{font-size:1.25rem} .sub{margin-bottom:14px}
  .card{padding:14px 12px;overflow:hidden}
  /* filtros y formularios */
  .row{gap:10px}
  .row>div{flex:1 1 44%;min-width:120px}
  .row select,.row input:not([type=file]){width:100%}
  .row input[type=file]{width:100%;max-width:100%;font-size:.8rem}
  .row>button.btn{flex:1 1 100%}
  select,input,button.btn{min-height:42px;font-size:16px}
  button.btn.danger{min-height:36px;font-size:.8rem;padding:6px 12px}
  .nota-in{width:58px;padding:6px 4px}
  /* tarjetas de indicadores en 2 columnas */
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat div{min-width:0;padding:12px}
  .stat b{font-size:1.35rem}
  /* pestañas con desplazamiento lateral */
  .tabbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-right:-12px;padding-right:12px}
  .tabbar button{flex:0 0 auto;white-space:nowrap;padding:9px 14px}
  /* tablas: se desplazan dentro de su caja */
  main>table,.card>table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:.8rem} th,td{padding:8px 7px}
  .heat{min-width:520px}
  /* barras: nombre arriba, barra y valor debajo */
  .bar-row{flex-wrap:wrap;gap:4px 10px;margin:12px 0}
  .bar-label{width:100%;flex:0 0 100%;font-weight:600}
  .bar-row b{width:auto!important;min-width:90px}
  .login-card{width:100%;max-width:340px;margin:16px;padding:28px 22px}
  .overlay .box{min-width:0;width:86vw}
  /* botón guardar siempre a mano */
  #saveGrades,#saveAlumno{position:fixed;bottom:14px;left:14px;right:14px;width:auto;z-index:40;min-height:48px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
}
@media print{#saveGrades,#saveAlumno{display:none}}

body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--sky);color:var(--tx);min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:0;background:var(--logo) center/min(70vmin,520px) no-repeat;opacity:.10;pointer-events:none}
#root{position:relative;z-index:1}
.app{display:block;min-height:100vh}
nav{background:none;width:100%;flex:none;height:auto;position:static;padding:16px 28px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:1160px;margin:0 auto;overflow:visible}
nav .brand{font-weight:500;font-size:1.3rem;color:#fff;letter-spacing:-.5px;margin-right:16px;line-height:1.1}
nav .brand small{display:block;font-size:.68rem;font-weight:400;opacity:.9;letter-spacing:0}
nav button{display:inline-block;width:auto;border:none;background:none;color:#fff;font-family:inherit;font-size:.92rem;padding:8px 16px;border-radius:99px;cursor:pointer;transition:background .15s}
nav button:hover{background:rgba(255,255,255,.22)}
nav button.active{background:#fff;color:var(--tx)}
nav .signout{margin:0 0 0 auto!important;opacity:1;font-size:.85rem;padding:8px 16px!important}
main{background:#fff;border-radius:18px;padding:30px 34px;margin:16px auto 32px;max-width:1160px;width:calc(100% - 56px);box-shadow:0 12px 32px rgba(20,60,110,.18)}
h2{font-family:inherit;font-weight:500;font-size:1.6rem;letter-spacing:-.3px}
h3{color:var(--tx);font-weight:500}
.sub,.login-card .sub{color:var(--mu)}
label{color:var(--mu)}
select,input{border:1px solid var(--hl);border-radius:10px;padding:9px 12px;background:#fff}
select:focus,input:focus{outline:2px solid rgba(91,91,240,.35);border-color:var(--ind)}
button.btn{background:var(--ind);border-radius:99px;padding:10px 22px;font-size:.9rem;transition:background .15s}
button.btn:hover{background:var(--ind-2)}
button.btn.ghost{background:none;color:var(--ind);border:1px solid var(--ind)}
button.btn.ghost:hover{background:#f1f1ff}
button.btn.danger{border-radius:99px;padding:5px 12px}
.tabbar button{border:none;background:#f1f1f6;color:#555;border-radius:99px;padding:8px 16px;font-size:.85rem;transition:background .15s}
.tabbar button:hover{background:#e6e6f8}
.tabbar button.active{background:var(--ind);color:#fff}
table{background:none;font-family:inherit}
th{background:none;color:var(--mu);font-weight:400;font-size:.74rem;border-bottom:1px solid var(--hl)}
td{border-bottom:1px solid var(--hl)}
tr:hover td{background:#f7f8ff}
.nota-in{border:1px solid #e1e3ea;border-radius:8px;background:#fff}
.nota-in:focus{outline:2px solid var(--ind);outline-offset:-1px;background:#fff}
.c.lk input{background:#f1f1f6;color:#666}
.c.md input{background:#fff4d6;border-color:#D9A441;color:#8a6212;font-weight:700}
.card{background:#fafbff;border:1px solid var(--hl);border-radius:14px}
.stat div{background:#f6f7fd;border:none;border-radius:14px}
.stat b{font-family:inherit;font-weight:500;color:var(--ind)}
.bar-track{background:#eef0f6;border-radius:99px;height:12px}
.bar-fill{border-radius:99px}
.overlay .box{border-radius:16px}.spinner{border-top-color:var(--ind)}.progress i{background:var(--ind)}.progress{border-radius:99px}

.login-wrap{background:none;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
.login-wm{position:absolute;top:22px;left:28px;font-weight:500;font-size:1.5rem;color:#fff;letter-spacing:-.5px}
.login-card{background:#fff;border-radius:16px;padding:0;width:340px;max-width:100%;box-shadow:0 12px 32px rgba(20,60,110,.18)}
.lg-hd{display:flex;align-items:center;gap:12px;padding:22px 22px 18px}
.lg-ci{width:42px;height:42px;border-radius:50%;background:var(--ind);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:500;flex:none}
.lg-tt{font-size:1.25rem;line-height:1.2}
.lg-ul{font-size:.78rem;border-bottom:1px solid var(--tx);display:inline-block}
.lg-fl{border-top:1px solid var(--hl);padding:9px 22px 7px}
.lg-fl label{font-size:.7rem;margin:0}
.lg-fl input{border:none;outline:none!important;background:transparent;width:100%;height:28px;padding:0;margin:0;font-size:1rem;border-radius:0}

.pb{border:none;border-radius:99px;padding:0 34px;height:44px;font-size:1rem;color:#fff;background:#b9bcc4;cursor:pointer;transition:background .15s}
.pb.on{background:var(--ind)}.pb.on:hover{background:var(--ind-2)}
.lg-ex{padding:0 22px 18px;font-size:.85rem}
.lg-ex a{color:var(--ind)}
@media(max-width:760px){

}

<div id="root"></div>
<script>
/* ======= CONFIGURA ESTOS DOS VALORES CON LOS DE TU PROYECTO SUPABASE ======= */
const SUPABASE_URL = 'https://veweurnswptrraqkript.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZld2V1cm5zd3B0cnJhcWtyaXB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTMwMTksImV4cCI6MjEwNjE2OTAxOX0.xAF7cH6k79jxMUxAqHrRjPZD21XJNZrHGm1jAH55ppo';
/* ============================================================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CURSOS=['Aritmética','Geometría','Trigonometría','Razonamiento Matemático','Álgebra'];
const BIMS=[1,2,3,4];
const BIM_LABEL={1:'I',2:'II',3:'III',4:'IV'};
const APROB=13;
const GRADO_LABEL={1:'1° de Secundaria',2:'2° de Secundaria',3:'3° de Secundaria',4:'4° de Secundaria',5:'5° de Secundaria'};

let DATA={students:[],records:{}};
let session=null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function estadoClass(p){return p===null?'':(p>=APROB?'aprob':'desaprob');}
function uid(){return 's'+Math.random().toString(36).slice(2,9);}
function avg2(a,b){const v=[a,b].filter(x=>x!==null&&x!==undefined);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null;}
function computeProm(r){
  if(!r)return null;
  const cu=avg2(r.cN1,r.cN2), li=avg2(r.lN1,r.lN2), co=avg2(r.conN1,r.conN2);
  const comps=[cu,li,co,r.exM??null,r.exB??null].filter(v=>v!==null&&v!==undefined);
  if(!comps.length)return null;
  return Math.ceil(comps.reduce((a,b)=>a+b,0)/comps.length);
}
function getRec(sid,curso,bim){return (DATA.records[sid]&&DATA.records[sid][curso]&&DATA.records[sid][curso][bim])||null;}
function promAlumnoCurso(sid,curso,bim){return computeProm(getRec(sid,curso,bim));}
function promAlumnoGeneral(sid,bim){
  const vals=CURSOS.map(c=>promAlumnoCurso(sid,c,bim)).filter(v=>v!==null);
  return vals.length? Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*100)/100 : null;
}
const CAMPOS=['cN1','cN2','lN1','lN2','conN1','conN2','exM','exB'];
function pctLleno(r){
  if(!r)return 0;
  const n=CAMPOS.filter(c=>r[c]!==null&&r[c]!==undefined&&r[c]!=='').length;
  return Math.round(n/CAMPOS.length*100);
}
function pctColor(p){return p>=100?'var(--green)':(p===0?'var(--red)':'#b7791f');}
function pctCell(sid,p){return `<td id="pct-${sid}" style="font-weight:600;color:${pctColor(p)}">${p}%</td>`;}
function grados(){return[...new Set(DATA.students.map(s=>s.grado))].sort((a,b)=>a-b);}
function studentsOf(g){return DATA.students.filter(s=>s.grado==g).sort((a,b)=>a.nombre.localeCompare(b.nombre));}

/* ---------- Carga de datos desde Supabase ---------- */
async function loadAllData(){
  const {data:studs,error:e1} = await sb.from('students').select('*');
  const {data:grds,error:e2} = await sb.from('grades').select('*');
  if(e1||e2){ alert('Error cargando datos: '+((e1||e2).message)); return; }
  DATA.students = studs.map(s=>({id:s.id,nombre:s.nombre,grado:s.grado}));
  DATA.records = {};
  grds.forEach(r=>{
    DATA.records[r.sid]=DATA.records[r.sid]||{};
    DATA.records[r.sid][r.curso]=DATA.records[r.sid][r.curso]||{};
    DATA.records[r.sid][r.curso][r.bim]={cN1:r.c_n1,cN2:r.c_n2,lN1:r.l_n1,lN2:r.l_n2,conN1:r.con_n1,conN2:r.con_n2,exM:r.ex_m,exB:r.ex_b};
  });
}
async function upsertGradeRow(sid,curso,bim){
  const r=getRec(sid,curso,bim)||{};
  const {error}=await sb.from('grades').upsert({
    sid,curso,bim,c_n1:r.cN1??null,c_n2:r.cN2??null,l_n1:r.lN1??null,l_n2:r.lN2??null,
    con_n1:r.conN1??null,con_n2:r.conN2??null,ex_m:r.exM??null,ex_b:r.exB??null
  },{onConflict:'sid,curso,bim'});
  if(error) alert('Error guardando: '+error.message);
}
async function insertStudent(nombre,grado){
  const id=uid();
  const {error}=await sb.from('students').insert({id,nombre,grado});
  if(error){ alert('Error agregando alumno: '+error.message); return null; }
  DATA.students.push({id,nombre,grado});
  return id;
}
async function deleteStudentRemote(id){
  const {error}=await sb.from('students').delete().eq('id',id);
  if(error){ alert('Error eliminando: '+error.message); return; }
  DATA.students=DATA.students.filter(s=>s.id!==id);
  delete DATA.records[id];
}
function setField(sid,curso,bim,field,val){
  DATA.records[sid]=DATA.records[sid]||{};
  DATA.records[sid][curso]=DATA.records[sid][curso]||{};
  DATA.records[sid][curso][bim]=DATA.records[sid][curso][bim]||{};
  DATA.records[sid][curso][bim][field]= val===''? null : Math.max(0,Math.min(20,Number(val)));
}

/* ---------- Login ---------- */

    <div class="lg-ft"><div class="lg-dt">•••</div><button class="pb" id="loginBtn">${isReg?'Crear cuenta':'Ingresar'}</button></div>

    <div style="margin-top:10px"><a href="#" id="toggleMode">${isReg?'Ya tengo cuenta: ingresar':'¿No tienes cuenta? Crear cuenta'}</a></div></div>
  </div></div>`;
  const chk=()=>{const b=document.getElementById('loginBtn');if(b)b.classList.toggle('on',document.getElementById('loginEmail').value.trim()!==''&&document.getElementById('loginPass').value!=='');};
  ['loginEmail','loginPass'].forEach(id=>document.getElementById(id).addEventListener('input',chk));setTimeout(chk,400);
  document.getElementById('toggleMode').onclick=e=>{e.preventDefault();renderLogin('',isReg?'login':'registro');};
  document.getElementById('loginBtn').onclick=async()=>{
    const email=document.getElementById('loginEmail').value.trim();
    const password=document.getElementById('loginPass').value;
    if(isReg){
      if(password.length<6){renderLogin('La contraseña debe tener al menos 6 caracteres.','registro');return;}
      if(password!==document.getElementById('loginPass2').value){renderLogin('Las contraseñas no coinciden.','registro');return;}
      const {data,error}=await sb.auth.signUp({email,password});
      if(error){renderLogin(error.message,'registro');return;}
      if(data.session){ session=data.session; await loadAllData(); tab='estudiantes'; render(); return; }
      renderLogin('','login','Cuenta creada. Revisa tu correo y confirma el enlace; luego ingresa aquí.');
      return;
    }
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){ renderLogin(error.message); return; }
    session=data.session;
    await loadAllData();
    tab='estudiantes'; render();
  };
}

function cellHtml(attrs,val){
  const v=(val===null||val===undefined)?'':String(val),lk=v!=='';
  return `<div class="c${lk?' lk':''}"><input type="text" inputmode="decimal" autocomplete="off" class="nota-in" ${attrs} data-o="${v}" value="${v}"${lk?' readonly':''}>${LKI}<div class="pv"></div></div>`;

const CHG='<div class="chgbar"><span id="chgCnt">Sin cambios</span><button class="btn ghost" id="undoChg">Descartar cambios</button><div style="flex-basis:100%;font-size:.78rem;color:#777;font-family:\'Segoe UI\',Arial">Las notas guardadas tienen candado: tócalas dos veces para editarlas. En amarillo ves lo que cambiaste y su valor anterior.</div></div>';
const normN=v=>v===''||v===null||v===undefined?'':String(Number(v));
function modCount(){return [...document.querySelectorAll('.nota-in[data-o]')].filter(i=>normN(i.value)!==normN(i.dataset.o)).length;}
function updCount(){
  const n=modCount(),c=document.getElementById('chgCnt');
  if(c){c.textContent=n?(n+(n===1?' cambio sin guardar':' cambios sin guardar')):'Sin cambios';c.classList.toggle('on',n>0);}
  ['saveGrades','saveAlumno'].forEach(id=>{const b=document.getElementById(id);if(b&&!b.disabled){if(!b.dataset.base)b.dataset.base=b.textContent;b.textContent=n?`${b.dataset.base} (${n})`:b.dataset.base;}});
}
function wireLock(m){
  m.querySelectorAll('.nota-in[data-o]').forEach(inp=>{
    const box=inp.parentElement,pv=box.querySelector('.pv');let t=0;
    const upd=()=>{
      const md=normN(inp.value)!==normN(inp.dataset.o);
      box.classList.toggle('md',md);box.classList.toggle('lk',inp.readOnly);
      pv.textContent=md?'antes: '+(inp.dataset.o===''?'vacío':inp.dataset.o):'';
    };
    const unlock=()=>{inp.readOnly=false;upd();inp.focus();inp.select();};
    inp.addEventListener('click',()=>{if(!inp.readOnly)return;const n=Date.now();if(n-t<500)unlock();else t=n;});
    inp.addEventListener('keydown',e=>{if(inp.readOnly&&(e.key==='F2'||e.key===' ')){e.preventDefault();unlock();}});
    inp.addEventListener('input',()=>{upd();updCount();});
    inp.addEventListener('blur',()=>{if(!inp.readOnly&&normN(inp.value)===normN(inp.dataset.o)&&inp.dataset.o!==''){inp.value=inp.dataset.o;inp.readOnly=true;}upd();});
    upd();
  });
  const u=document.getElementById('undoChg');
  if(u)u.onclick=()=>{
    m.querySelectorAll('.nota-in[data-o]').forEach(i=>{
      if(normN(i.value)!==normN(i.dataset.o)){i.value=i.dataset.o;i.dispatchEvent(new Event('input',{bubbles:true}));}
      i.readOnly=i.dataset.o!=='';i.dispatchEvent(new Event('blur'));
    });
    window._dirtyA=false;updCount();
  };
  updCount();
}

const BASEC={'Razonamiento Matemático':'Razonamiento Mat.'};
function pendData(g,bim){
  const list=studentsOf(g),vacio=v=>v===null||v===undefined||v==='';
  const rows=list.map(s=>{
    const sin=CURSOS.every(c=>{const r=getRec(s.id,c,bim);return !r||CAMPOS.every(k=>vacio(r[k]));});
    const f=(a,b)=>CURSOS.map(c=>{const r=getRec(s.id,c,bim)||{},m=[];if(vacio(r[a]))m.push('N1');if(vacio(r[b]))m.push('N2');return m.length?`${BASEC[c]||c} (${m.join(', ')})`:null;}).filter(Boolean);
    return{s,sin,cu:sin?[]:f('cN1','cN2'),li:sin?[]:f('lN1','lN2')};
  });
  const pend=rows.filter(x=>x.sin||x.cu.length||x.li.length);
  return{pend,total:list.length,ok:list.length-pend.length};
}

function descargarPendientes(gl,bim){
  if(!window.jspdf){alert('No se pudo cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.');return;}
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const NAVY=[27,42,65],RED=[180,68,61],ORD={1:'1.er',2:'2.º',3:'3.er',4:'4.º'},NG={1:'1ro',2:'2do',3:'3ro',4:'4to',5:'5to'};
  let first=true;
  gl.forEach(g=>{
    if(!studentsOf(g).length)return;
    if(!first)doc.addPage();first=false;
    const d=pendData(g,bim);
    doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(...NAVY);doc.text('Pendientes de entrega: cuadernos y libros',14,16);
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90,90,90);doc.text(`Colegio Los Ángeles de Jesús · ${ORD[bim]} bimestre · ${g}° de Secundaria`,14,22);
    doc.setFontSize(8.5);
    const nt=doc.splitTextToSize('Se consideran pendientes las notas de Cuaderno o Libro (N1 y N2) que están vacías. Entre paréntesis se indica qué nota falta. Un alumno sin ninguna nota registrada aparece como «Sin registro».',182);
    doc.text(nt,14,28);
    const y=28+nt.length*4+4;
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...NAVY);doc.text(`${g}° de Secundaria`,14,y);
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(90,90,90);doc.text(`${d.pend.length} de ${d.total} alumnos con pendientes · ${d.ok} al día`,14,y+5.5);
    if(!d.pend.length){doc.text('Todos los alumnos están al día.',14,y+14);return;}
    doc.autoTable({theme:'grid',startY:y+9,margin:{left:14,right:14},
      head:[['Alumno','Cuadernos que faltan','Libros que faltan']],
      body:d.pend.map(x=>[x.s.nombre,x.sin?'Sin registro':(x.cu.join('\n')||'-'),x.sin?'Sin registro':(x.li.join('\n')||'-')]),
      headStyles:{fillColor:[236,231,218],textColor:[68,68,68],fontStyle:'bold',fontSize:9,lineColor:[216,210,194]},
      styles:{fontSize:9,cellPadding:2,lineColor:[216,210,194],textColor:[32,35,43],fillColor:[255,255,255],valign:'top'},
      columnStyles:{0:{cellWidth:42,fontStyle:'bold'},1:{cellWidth:70},2:{cellWidth:70}},
      didParseCell:h=>{if(h.section==='body'&&h.cell.raw==='Sin registro'){h.cell.styles.textColor=RED;h.cell.styles.fontStyle='italic';}}});
  });
  doc.save(gl.length===1?`Pendientes_${NG[gl[0]]||gl[0]}_Secundaria.pdf`:'Pendientes_Todos_los_grados.pdf');
}

  return `<h2>Registro de notas</h2><div class="sub">El Promedio se calcula solo (redondeado hacia arriba). Al guardar, se sube directo a la nube.</div>
  <div class="row">
    <div><label>Grado</label><select id="rGrado">${gs.map(x=>`<option value="${x}" ${x==g?'selected':''}>${x}°</option>`).join('')}</select></div>
    <div><label>Curso</label><select id="rCurso">${CURSOS.map(c=>`<option ${c==curso?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div><label>Bimestre</label><select id="rBim">${BIMS.map(b=>`<option value="${b}" ${b==bim?'selected':''}>${BIM_LABEL[b]}</option>`).join('')}</select></div>
  </div>
  ${list.length?`${CHG}<div style="overflow-x:auto"><table><thead><tr><th>Alumno</th><th>Cuad. N1</th><th>Cuad. N2</th><th>Libro N1</th><th>Libro N2</th><th>Cond. N1</th><th>Cond. N2</th><th>Ex.Mensual</th><th>Ex.Bimestral</th><th>Promedio</th><th>% llenado</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="sub" id="resumenLleno" style="margin:10px 0 0">${completos} de ${list.length} alumnos con todas sus notas completas.</div>
  <div style="margin-top:14px"><button class="btn" id="saveGrades">Guardar notas</button></div>`
  :'<div class="empty">No hay alumnos en ese grado.</div>'}`;
}

/* ---------- ANÁLISIS PROFESIONAL ---------- */
const PAL=['#1B2A41','#D9A441','#2f6b4a','#B4443D','#6b7fd7'];
const COMPS=[['cu','Cuaderno'],['li','Libro'],['co','Conducta'],['exM','Ex. Mensual'],['exB','Ex. Bimestral']];
const BK=[['0–5',0,6],['6–9',6,10],['10–12',10,13],['13–14',13,15],['15–16',15,17],['17–18',17,19],['19–20',19,21]];
const AF=()=>window._af=window._af||{g:'all',b:3};
const r2=x=>Math.round(x*100)/100, mean=a=>a.length?r2(a.reduce((x,y)=>x+y,0)/a.length):null;
const bset=b=>b==='all'?BIMS:[b];
const col=v=>v===null?'#bbb':v<13?'#B4443D':v<14?'#d0793f':v<15?'#D9A441':v<17?'#6b9a4a':'#2f6b4a';
function pcs(sid,c,b){return mean(bset(b).map(x=>promAlumnoCurso(sid,c,x)).filter(v=>v!==null));}
function pgen(sid,b){return mean(CURSOS.map(c=>pcs(sid,c,b)).filter(v=>v!==null));}
function lst(){const g=AF().g;return g==='all'?DATA.students:studentsOf(g);}
function vals(l,c,b){return l.map(s=>pcs(s.id,c,b)).filter(v=>v!==null);}
function stat(a){const n=a.length;if(!n)return{n:0,avg:null,ap:null,min:null,max:null,sd:null,fail:0};const m=a.reduce((x,y)=>x+y,0)/n;return{n,avg:r2(m),ap:Math.round(a.filter(v=>v>=APROB).length/n*100),min:Math.min(...a),max:Math.max(...a),sd:r2(Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/n)),fail:a.filter(v=>v<APROB).length};}
function comp(l,c,b,k){const o=[];l.forEach(s=>bset(b).forEach(x=>{const r=getRec(s.id,c,x);if(!r)return;const v=k==='cu'?avg2(r.cN1,r.cN2):k==='li'?avg2(r.lN1,r.lN2):k==='co'?avg2(r.conN1,r.conN2):k==='exM'?r.exM:r.exB;if(v!==null&&v!==undefined)o.push(v);}));return mean(o);}
function weak(l,c,b){return COMPS.map(([k,n])=>({l:n,v:comp(l,c,b,k)})).filter(x=>x.v!==null).sort((p,q)=>p.v-q.v)[0];}
const empty=t=>`<div class="empty">${t||'Aún no hay notas registradas para este filtro.'}</div>`;
const kpi=a=>`<div class="stat">${a.map(([v,l,c])=>`<div><b style="${c?'color:'+c:''}">${v}</b><span>${l}</span></div>`).join('')}</div>`;

function filtBar(o={}){const f=AF(),gs=grados();return `<div class="row no-print">${o.g===false?'':`<div><label>Grado</label><select id="afG"><option value="all" ${f.g==='all'?'selected':''}>Todo el colegio</option>${gs.map(g=>`<option value="${g}" ${f.g==g?'selected':''}>${g}°</option>`).join('')}</select></div>`}${o.b===false?'':`<div><label>Bimestre</label><select id="afB"><option value="all" ${f.b==='all'?'selected':''}>Todo el año</option>${BIMS.map(b=>`<option value="${b}" ${f.b===b?'selected':''}>${BIM_LABEL[b]} Bimestre</option>`).join('')}</select></div>`}${o.x||''}<button class="btn ghost" onclick="window.print()">Imprimir</button></div>`;}
function bars(items){return items.map(i=>`<div class="bar-row" ${i.a||''} data-tip="${esc(i.t||'')}" style="${i.a?'cursor:pointer':''}"><div class="bar-label">${esc(i.l)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,(i.v||0)/20*100)}%;background:${col(i.v)}"></div><i class="thr"></i></div><b style="width:110px;font-size:.8rem">${i.v??'—'} <span style="font-weight:400;color:#777">${i.s||''}</span></b></div>`).join('')||empty('Sin datos');}
function heat(b){return `<div style="overflow-x:auto"><table class="heat"><thead><tr><th></th>${CURSOS.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${grados().map(g=>`<tr><th>${g}°</th>${CURSOS.map(c=>{const st=stat(vals(studentsOf(g),c,b));return `<td data-gg="${g}" data-gc="${esc(c)}" data-tip="${g}° · ${esc(c)}: prom. ${st.avg??'—'} · ${st.ap??'—'}% aprobados · ${st.n} alumnos" style="background:${col(st.avg)}">${st.avg??'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;}
function hist(a){const c=BK.map(([l,lo,hi])=>({l,lo,n:a.filter(v=>v>=lo&&v<hi).length})),mx=Math.max(1,...c.map(x=>x.n));return `<div style="display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:6px">${c.map(x=>`<div style="flex:1;text-align:center;font:12px 'Segoe UI',Arial" data-tip="${x.n} alumnos con promedio ${x.l}"><b>${x.n}</b><div style="height:${x.n/mx*100}px;background:${col(x.lo)};border-radius:3px 3px 0 0;min-height:2px"></div><div style="color:#666;margin-top:4px">${x.l}</div></div>`).join('')}</div>`;}
function line(S,L){const hid=window._hide||{},W=640,Ht=260,l=36,r=14,t=12,bt=28;const all=S.filter(s=>!hid[s.n]).flatMap(s=>s.d).filter(v=>v!==null);const lo=Math.max(0,Math.floor(Math.min(...all,APROB)-1)),hi=20;const X=i=>l+(L.length>1?i*(W-l-r)/(L.length-1):(W-l-r)/2),Y=v=>t+(hi-v)/(hi-lo)*(Ht-t-bt);let g='';for(let v=lo;v<=hi;v+=2)g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eee"/><text x="${l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#888">${v}</text>`;g+=`<line x1="${l}" x2="${W-r}" y1="${Y(APROB)}" y2="${Y(APROB)}" stroke="#B4443D" stroke-dasharray="4 4"/><text x="${W-r}" y="${Y(APROB)-4}" font-size="10" text-anchor="end" fill="#B4443D">Aprobatoria ${APROB}</text>`;L.forEach((x,i)=>g+=`<text x="${X(i)}" y="${Ht-8}" font-size="11" text-anchor="middle" fill="#666">${x}</text>`);S.forEach(s=>{if(hid[s.n])return;let d='',pen=false;s.d.forEach((v,i)=>{if(v===null){pen=false;return;}d+=(pen?'L':'M')+X(i)+' '+Y(v);pen=true;});g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}"/>`;s.d.forEach((v,i)=>{if(v!==null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${s.c}" stroke="#fff" data-tip="${esc(s.n)} · ${L[i]}: ${v}"/>`;});});return `<div class="legend">${S.map(s=>`<button class="lg ${hid[s.n]?'off':''}" data-lg="${esc(s.n)}"><i style="background:${s.c}"></i>${esc(s.n)}</button>`).join('')}</div><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Ht}" style="width:100%;min-width:560px;height:auto">${g}</svg></div>`;}

function viewAnalisis(){
  const T=[['resumen','Resumen'],['cursos','Cursos'],['grados','Grados'],['alumnos','Alumno'],['riesgo','Riesgo y mérito'],['tend','Tendencias']];
  const m=T.some(x=>x[0]===window._am)?window._am:'resumen';
  const body={resumen:aResumen,cursos:aCursos,grados:aGrados,alumnos:aAlumno,riesgo:aRiesgo,tend:aTend}[m]();
  return `<h2>Análisis</h2><div class="sub">Panel interactivo: filtra, pasa el mouse sobre los gráficos y haz clic en cursos, celdas o alumnos para ver el detalle. La línea punteada marca la nota aprobatoria (${APROB}).</div>
  <div class="tabbar no-print">${T.map(x=>`<button data-am="${x[0]}" class="${m===x[0]?'active':''}">${x[1]}</button>`).join('')}</div>${body}`;
}

function aResumen(){
  const l=lst(),b=AF().b,f=filtBar();
  const cs=CURSOS.map(c=>({c,...stat(vals(l,c,b))})).filter(x=>x.n);
  const gens=l.map(s=>pgen(s.id,b)).filter(v=>v!==null);
  if(!gens.length)return f+empty();
  const ries=gens.filter(v=>v<APROB).length,apG=Math.round((gens.length-ries)/gens.length*100);
  const avance=Math.round(mean(l.flatMap(s=>CURSOS.flatMap(c=>bset(b).map(x=>pctLleno(getRec(s.id,c,x)))))));
  const so=[...cs].sort((x,y)=>x.avg-y.avg),lo=so[0],hi=so[so.length-1];
  const lowAp=[...cs].sort((x,y)=>x.ap-y.ap)[0],disp=[...cs].sort((x,y)=>y.sd-x.sd)[0],wk=weak(l,lo.c,b);
  let cell=null;grados().forEach(g=>{if(AF().g!=='all'&&AF().g!=g)return;CURSOS.forEach(c=>{const st=stat(vals(studentsOf(g),c,b));if(st.n&&(!cell||st.avg<cell.avg))cell={g,c,avg:st.avg};});});
  const ins=[`El curso con <b>menor promedio</b> es <b>${lo.c}</b> (${lo.avg}) y el de <b>mayor promedio</b> es <b>${hi.c}</b> (${hi.avg}).`,
   lowAp.ap<100?`<b>${lowAp.c}</b> tiene la aprobación más baja: solo <b>${lowAp.ap}%</b> de los alumnos aprueba.`:'Todos los cursos tienen 100% de aprobación.',
   wk?`En ${lo.c}, el componente más débil es <b>${wk.l}</b> (prom. ${wk.v}): buen punto de partida para reforzar.`:'',
   cell?`El punto más crítico es <b>${cell.g}° en ${cell.c}</b>, con promedio ${cell.avg}.`:'',
   `<b>${ries}</b> de ${gens.length} alumnos (${100-apG}%) tienen promedio general menor a ${APROB}.`,
   disp&&disp.sd>=2.5?`<b>${disp.c}</b> tiene el rendimiento más desigual (desv. ${disp.sd}): conviven alumnos muy altos y muy bajos.`:''].filter(Boolean);
  return f+kpi([[mean(gens),'Promedio general',col(mean(gens))],[l.length,'Alumnos'],[apG+'%','Aprobación general',col(apG>=80?16:apG>=60?14:12)],[ries,'Alumnos en riesgo',ries?CLRB:''],[avance+'%','Avance del registro']])+
  `<div class="card" style="border-left:4px solid var(--amber)"><b style="font-family:Georgia,serif">Hallazgos clave</b><ul style="margin:8px 0 0;padding-left:20px;line-height:1.7;font-family:'Segoe UI',Arial;font-size:.88rem">${ins.map(i=>`<li>${i}</li>`).join('')}</ul></div>
  <div class="card"><b style="font-family:Georgia,serif">Promedio por curso</b> <span class="sub">(clic en un curso para ver su detalle)</span><div style="margin-top:10px">${bars(CURSOS.map(c=>{const st=stat(vals(l,c,b));return{l:c,v:st.avg,s:st.n?st.ap+'% aprob.':'',t:`${c}: ${st.n} alumnos, ${st.fail} desaprobados`,a:`data-gc="${esc(c)}"`};}))}</div></div>
  <div class="card"><b style="font-family:Georgia,serif">Mapa de calor: grado × curso</b> <span class="sub">(rojo = desaprobado, verde = alto rendimiento)</span><div style="margin-top:10px">${heat(b)}</div></div>`;
}
const CLRB='#B4443D';

function aCursos(){
  const l=lst(),b=AF().b,c=CURSOS.includes(window._ac)?window._ac:CURSOS[0];
  const f=filtBar({x:`<div><label>Curso</label><select id="acSel">${CURSOS.map(x=>`<option ${x===c?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`});
  const pri=st=>!st.n?['Sin datos','']:(st.avg<APROB||st.ap<60)?['Alta','bad']:(st.ap<80||st.avg<15)?['Media','mid']:['Baja','ok'];
  const rows=CURSOS.map(x=>({x,st:stat(vals(l,x,b)),w:weak(l,x,b)}));
  const tbl=`<div style="overflow-x:auto"><table><thead><tr><th>Curso</th><th>Prom.</th><th>% aprob.</th><th>Desaprob.</th><th>Mín–Máx</th><th>Desv.</th><th>Componente débil</th><th>Prioridad de mejora</th></tr></thead><tbody>${rows.map(({x,st,w})=>{const p=pri(st);return `<tr data-gc="${esc(x)}" style="cursor:pointer;${x===c?'background:#fbf3df':''}"><td><b>${esc(x)}</b></td><td>${st.avg??'—'}</td><td>${st.ap??'—'}${st.n?'%':''}</td><td>${st.n?st.fail:'—'}</td><td>${st.min??'—'}–${st.max??'—'}</td><td>${st.sd??'—'}</td><td>${w?w.l+' ('+w.v+')':'—'}</td><td><span class="pill ${p[1]}">${p[0]}</span></td></tr>`}).join('')}</tbody></table></div>`;
  const a=vals(l,c,b),st=stat(a);
  if(!st.n)return f+`<div class="card"><b style="font-family:Georgia,serif">Comparativo de cursos</b>${tbl}</div>`+empty();
  const rk=l.map(s=>({s,v:pcs(s.id,c,b)})).filter(x=>x.v!==null).sort((p,q)=>q.v-p.v);
  const li=arr=>arr.map(x=>`<tr data-gs="${x.s.id}" style="cursor:pointer"><td>${esc(x.s.nombre)}</td><td>${x.s.grado}°</td><td class="${estadoClass(x.v)}">${x.v}</td></tr>`).join('');
  const gs=AF().g==='all'?grados():[AF().g];
  return f+`<div class="card"><b style="font-family:Georgia,serif">Comparativo de cursos</b> <span class="sub">(prioridad: Alta si prom. &lt; ${APROB} o aprobación &lt; 60%)</span>${tbl}</div>
  <h3>Detalle de ${esc(c)}</h3>${kpi([[st.avg,'Promedio',col(st.avg)],[st.ap+'%','Aprobación'],[st.fail,'Desaprobados',st.fail?CLRB:''],[st.max,'Nota más alta'],[st.min,'Nota más baja']])}
  <div class="card"><b style="font-family:Georgia,serif">Distribución de notas</b>${hist(a)}</div>
  <div class="card"><b style="font-family:Georgia,serif">¿Qué componente jala hacia abajo?</b><div style="margin-top:10px">${bars(COMPS.map(([k,n])=>({l:n,v:comp(l,c,b,k),t:n+' en '+c})))}</div></div>
  <div class="card"><b style="font-family:Georgia,serif">Promedio por grado en ${esc(c)}</b><div style="margin-top:10px">${bars(gs.map(g=>{const s2=stat(vals(studentsOf(g),c,b));return{l:g+'° de Secundaria',v:s2.avg,s:s2.n?s2.ap+'% aprob.':''};}))}</div></div>
  <div class="grid2"><div class="card"><b style="font-family:Georgia,serif">🏆 Mejores 5</b><table><tbody>${li(rk.slice(0,5))}</tbody></table></div>
  <div class="card"><b style="font-family:Georgia,serif">⚠ Necesitan apoyo (5 más bajos)</b><table><tbody>${li(rk.slice(-5).reverse())}</tbody></table></div></div>`;
}

function aGrados(){
  const b=AF().b,f=filtBar({g:false});
  const rows=grados().map(g=>{const l=studentsOf(g),gens=l.map(s=>pgen(s.id,b)).filter(v=>v!==null),cs=CURSOS.map(c=>({c,...stat(vals(l,c,b))})).filter(x=>x.n).sort((p,q)=>p.avg-q.avg),rs=gens.filter(v=>v<APROB).length;return{g,n:l.length,avg:mean(gens),ap:gens.length?Math.round((gens.length-rs)/gens.length*100):null,rs,lo:cs[0],hi:cs[cs.length-1]};});
  if(!rows.some(x=>x.avg!==null))return f+empty();
  return f+`<div class="card"><b style="font-family:Georgia,serif">Promedio general por grado</b> <span class="sub">(clic para ver el resumen del grado)</span><div style="margin-top:10px">${bars(rows.map(x=>({l:x.g+'° de Secundaria',v:x.avg,s:x.ap!==null?x.ap+'% aprob.':'',t:`${x.n} alumnos · ${x.rs} en riesgo`,a:`data-gg="${x.g}"`})))}</div></div>
  <div class="card"><b style="font-family:Georgia,serif">Comparativo por grado</b><div style="overflow-x:auto"><table><thead><tr><th>Grado</th><th>Alumnos</th><th>Prom.</th><th>Aprobados / desaprobados</th><th>En riesgo</th><th>Mejor curso</th><th>Curso a reforzar</th></tr></thead><tbody>${rows.map(x=>`<tr data-gg="${x.g}" style="cursor:pointer"><td><b>${x.g}°</b></td><td>${x.n}</td><td class="${estadoClass(x.avg)}">${x.avg??'—'}</td><td><div style="display:flex;height:12px;min-width:120px;border-radius:3px;overflow:hidden;background:#eee" data-tip="${x.ap??0}% aprobados"><i style="width:${x.ap??0}%;background:#2f6b4a"></i><i style="flex:1;background:${x.ap===null?'#eee':'#B4443D'}"></i></div></td><td>${x.rs}</td><td>${x.hi?esc(x.hi.c)+' ('+x.hi.avg+')':'—'}</td><td>${x.lo?esc(x.lo.c)+' ('+x.lo.avg+')':'—'}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><b style="font-family:Georgia,serif">Mapa de calor: grado × curso</b><div style="margin-top:10px">${heat(b)}</div></div>`;
}

function aAlumno(){
  const all=[...DATA.students].sort((a,b)=>a.grado-b.grado||a.nombre.localeCompare(b.nombre));
  if(!all.length)return empty('Sin alumnos.');
  const s=all.find(x=>x.id===window._as)||all[0],b=AF().b,peers=studentsOf(s.grado);
  const sel=`<div><label>Alumno</label><select id="asSel">${grados().map(g=>`<optgroup label="${g}° de Secundaria">${all.filter(x=>x.grado===g).map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</optgroup>`).join('')}</select></div>`;
  const f=filtBar({g:false,x:sel}),gen=pgen(s.id,b);
  if(gen===null)return f+empty('Este alumno aún no tiene notas para el bimestre elegido.');
  const rank=peers.map(p=>pgen(p.id,b)).filter(v=>v!==null).sort((x,y)=>y-x),pos=rank.indexOf(gen)+1;
  const cs=CURSOS.map(c=>({c,v:pcs(s.id,c,b)})).filter(x=>x.v!==null).sort((x,y)=>x.v-y.v),bad=cs.filter(x=>x.v<APROB).length;
  const S=CURSOS.map((c,i)=>({n:c,c:PAL[i],d:BIMS.map(x=>promAlumnoCurso(s.id,c,x))}));S.push({n:'General',c:'#000',w:3.5,d:BIMS.map(x=>promAlumnoGeneral(s.id,x))});
  return f+kpi([[gen,'Promedio general',col(gen)],['#'+pos+' de '+rank.length,'Puesto en '+s.grado+'°'],[bad,'Cursos desaprobados',bad?CLRB:''],[mean(rank),'Promedio del grado']])+
  `<div class="card"><b style="font-family:Georgia,serif">Fortaleza y debilidad</b><div class="sub" style="margin:6px 0 0">Mayor fortaleza: <b>${esc(cs[cs.length-1].c)}</b> (${cs[cs.length-1].v}) · Curso a reforzar: <b>${esc(cs[0].c)}</b> (${cs[0].v})</div></div>
  <div class="card"><b style="font-family:Georgia,serif">Notas por curso vs. promedio del grado</b><div style="margin-top:10px">${bars(CURSOS.map(c=>({l:c,v:pcs(s.id,c,b),s:'grado: '+(mean(vals(peers,c,b))??'—'),t:c})))}</div></div>
  <div class="card"><b style="font-family:Georgia,serif">Evolución por bimestre</b> <span class="sub">(clic en la leyenda para ocultar líneas)</span>${line(S,BIMS.map(x=>BIM_LABEL[x]))}</div>`;
}

function aRiesgo(){
  const l=lst(),b=AF().b,f=filtBar();
  const rows=l.map(s=>({s,gen:pgen(s.id,b),bad:CURSOS.map(c=>({c,v:pcs(s.id,c,b)})).filter(x=>x.v!==null&&x.v<APROB)})).filter(x=>x.gen!==null);
  if(!rows.length)return f+empty();
  const lv=x=>x.bad.length>=3||x.gen<APROB?['Alto','bad']:x.bad.length===2?['Medio','mid']:['Leve','mid'];
  const risk=rows.filter(x=>x.bad.length||x.gen<APROB).sort((p,q)=>q.bad.length-p.bad.length||p.gen-q.gen);
  const honor=[...rows].sort((p,q)=>q.gen-p.gen).slice(0,10);
  return f+kpi([[risk.length,'Alumnos con alerta',risk.length?CLRB:''],[risk.filter(x=>lv(x)[0]==='Alto').length,'Riesgo alto',CLRB],[Math.round(risk.length/rows.length*100)+'%','Del total evaluado']])+

async function importExcel(file){
  if(!file)return;
  showLoading('Actualizando base de datos...');
  setLoading('Leyendo el archivo...',3);
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const sheetName=wb.SheetNames.find(n=>n.toLowerCase()==='notas')||wb.SheetNames[0];
    const ws=wb.Sheets[sheetName];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
    const clean=v=>(v===null||v===undefined||v==='')?null:Number(v);
    const total=rows.length||1;
    const batch=new Map();
    let n=0,i=0;
    for(const r of rows){
      i++;
      const alumno=r['Alumno']; const grado=parseGradoNum(r['Grado']); const curso=r['Curso']; const bim=Number(r['Bimestre']);
      if(!alumno||!grado||!curso||!bim)continue;
      const s=await findOrCreateStudentRemote(alumno,grado);
      if(!s)continue;
      DATA.records[s.id]=DATA.records[s.id]||{};
      DATA.records[s.id][curso]=DATA.records[s.id][curso]||{};
      const rec={
        cN1:clean(r['Cuaderno N1']),cN2:clean(r['Cuaderno N2']),
        lN1:clean(r['Libro N1']),lN2:clean(r['Libro N2']),
        conN1:clean(r['Conducta N1']),conN2:clean(r['Conducta N2']),
        exM:clean(r['Examen Mensual']),exB:clean(r['Examen Bimestral'])
      };
      DATA.records[s.id][curso][bim]=rec;
      batch.set(s.id+'|'+curso+'|'+bim,{
        sid:s.id,curso,bim,c_n1:rec.cN1,c_n2:rec.cN2,l_n1:rec.lN1,l_n2:rec.lN2,
        con_n1:rec.conN1,con_n2:rec.conN2,ex_m:rec.exM,ex_b:rec.exB
      });
      n++;
      if(i%5===0){setLoading(`Procesando alumnos: fila ${i} de ${rows.length}`,3+Math.round(i/total*47));await new Promise(r=>setTimeout(r,0));}
    }
    const all=[...batch.values()];
    const CH=200;
    for(let k=0;k<all.length;k+=CH){
      const chunk=all.slice(k,k+CH);
      setLoading(`Guardando notas en la nube: ${Math.min(k+CH,all.length)} de ${all.length}`,50+Math.round(Math.min(k+CH,all.length)/all.length*50));
      const {error}=await sb.from('grades').upsert(chunk,{onConflict:'sid,curso,bim'});
      if(error)throw new Error(error.message);
    }
    setLoading('Listo',100);
    hideLoading();
    window._importFile=null;
    window._importMsg=`Importación completa: ${n} registros de notas actualizados en la nube.`;
    render();
  }catch(e){
    hideLoading();
    window._importMsg='No se pudo actualizar la base de datos. Verifica que el archivo tenga una hoja "Notas" con las columnas Bimestre, Grado, Curso, Alumno y las notas.'+(e&&e.message?' ('+e.message+')':'');
    render();
  }
}

function descargarReporteCompleto(bim){
  if(!window.jspdf){alert('No se pudo cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const NAVY=[27,42,65],GREEN=[47,107,74],RED=[180,68,61];
  const fmt=v=>(v===null||v===undefined)?'-':String(Math.round(v*100)/100);
  const titulo=(t,s)=>{
    doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...NAVY);doc.text(t,148.5,15,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(90,90,90);doc.text(s,148.5,21,{align:'center'});
  };
  const base={theme:'grid',headStyles:{fillColor:[236,231,218],textColor:[68,68,68],fontStyle:'bold',halign:'center',fontSize:8,lineColor:[216,210,194]},styles:{fontSize:8.5,cellPadding:1.8,lineColor:[216,210,194],textColor:[32,35,43],fillColor:[255,255,255]},margin:{left:14,right:14}};
  const gs=grados();
  let first=true;

  // Parte 1: consolidado por grado
  gs.forEach(g=>{
    const list=studentsOf(g); if(!list.length)return;
    if(!first)doc.addPage(); first=false;
    titulo(`CONSOLIDADO DE NOTAS - ${g}° DE SECUNDARIA`,`${BIM_LABEL[bim]} Bimestre · Colegio Los Ángeles de Jesús`);
    const body=list.map((s,i)=>[i+1,s.nombre,...CURSOS.map(c=>fmt(promAlumnoCurso(s.id,c,bim))),fmt(promAlumnoGeneral(s.id,bim))]);
    doc.autoTable({...base,startY:26,head:[['N°','Alumno',...CURSOS.map(c=>c.toUpperCase()),'PROM. GEN.']],body,
      columnStyles:{0:{halign:'center',cellWidth:10},1:{cellWidth:58}},
      didParseCell:d=>{
        if(d.section==='body'&&d.column.index>=2){
          d.cell.styles.halign='center';
          if(d.column.index===CURSOS.length+2){const v=parseFloat(d.cell.raw);if(!isNaN(v)){d.cell.styles.textColor=v>=APROB?GREEN:RED;d.cell.styles.fontStyle='bold';}}
        }
      }});
  });

  // Parte 2: registros por grado y curso
  gs.forEach(g=>{
    const list=studentsOf(g); if(!list.length)return;
    doc.addPage();
    titulo(`REGISTRO AUXILIAR - ${g}° DE SECUNDARIA`,`${BIM_LABEL[bim]} Bimestre · Colegio Los Ángeles de Jesús · Nota mínima aprobatoria: ${APROB}`);
    let y=28;
    CURSOS.forEach(c=>{
      if(y>165){doc.addPage();y=15;}
      doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...NAVY);doc.text(c.toUpperCase(),14,y);
      const body=list.map((s,i)=>{
        const r=getRec(s.id,c,bim);
        const prom=computeProm(r);
        const estado=prom===null?'-':(prom>=APROB?'Aprobado':'Desaprobado');
        return [i+1,s.nombre,fmt(r?avg2(r.cN1,r.cN2):null),fmt(r?avg2(r.lN1,r.lN2):null),fmt(r?avg2(r.conN1,r.conN2):null),fmt(r?r.exM:null),fmt(r?r.exB:null),fmt(prom),estado];
      });
      doc.autoTable({...base,startY:y+2,head:[['N°','Alumno','Cuaderno','Libro','Conducta','Ex. Mensual','Ex. Bimestral','Promedio','Estado']],body,
        styles:{...base.styles,fontSize:8,cellPadding:1.4},
        columnStyles:{0:{halign:'center',cellWidth:10},1:{cellWidth:62}},
        didParseCell:d=>{
          if(d.section==='body'&&d.column.index>=2){
            d.cell.styles.halign='center';
            if(d.column.index===8){
              if(d.cell.raw==='Aprobado')d.cell.styles.textColor=GREEN;
              else if(d.cell.raw==='Desaprobado')d.cell.styles.textColor=RED;
            }
          }
        }});
      y=doc.lastAutoTable.finalY+9;
    });
  });

  doc.save(`Reporte_Completo_${BIM_LABEL[bim]}_Bimestre.pdf`);
}

/* ---------- Arranque ---------- */
(async function start(){
  const {data:{session:s}}=await sb.auth.getSession();
  if(s){ session=s; await loadAllData(); render(); }
  else { renderLogin(); }
})();
</script>
</body>
